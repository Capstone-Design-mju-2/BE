<svg xmlns="http://www.w3.org/2000/svg" width="680" height="312" viewBox="0 0 680 312" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<title>재고 50개에 주문 200건: 판매된 주문 수</title>
<rect width="680" height="312" fill="#fcfcfb"/>
<text x="16" y="28" font-size="16" font-weight="600" fill="#0b0b0b">재고 50개에 주문 200건: 판매된 주문 수</text>
<text x="16" y="50" font-size="12" fill="#52514e">동시 요청 50개, 같은 옵션 하나에 1개씩 주문. 점선을 넘은 만큼이 초과 판매다.</text>
<line x1="120.0" y1="86" x2="120.0" y2="266" stroke="#e1e0d9" stroke-width="1"/>
<text x="120.0" y="282" font-size="11" fill="#898781" text-anchor="middle">0</text>
<line x1="207.5" y1="86" x2="207.5" y2="266" stroke="#e1e0d9" stroke-width="1"/>
<text x="207.5" y="282" font-size="11" fill="#898781" text-anchor="middle">50</text>
<line x1="295.0" y1="86" x2="295.0" y2="266" stroke="#e1e0d9" stroke-width="1"/>
<text x="295.0" y="282" font-size="11" fill="#898781" text-anchor="middle">100</text>
<line x1="382.5" y1="86" x2="382.5" y2="266" stroke="#e1e0d9" stroke-width="1"/>
<text x="382.5" y="282" font-size="11" fill="#898781" text-anchor="middle">150</text>
<line x1="470.0" y1="86" x2="470.0" y2="266" stroke="#e1e0d9" stroke-width="1"/>
<text x="470.0" y="282" font-size="11" fill="#898781" text-anchor="middle">200</text>
<text x="470" y="298" font-size="11" fill="#898781" text-anchor="end">판매된 주문 (건)</text>
<text x="110" y="107.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">none</text>
<path d="M120,92 h346.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-346.0 z" fill="#d03b3b"/>
<text x="478.0" y="107.0" font-size="12" fill="#52514e">200건 · 초과 판매 150</text>
<text x="110" y="143.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">conditional</text>
<path d="M120,128 h83.5 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-83.5 z" fill="#2a78d6"/>
<text x="215.5" y="143.0" font-size="12" fill="#52514e">50건 · 초과 판매 0</text>
<text x="110" y="179.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pessimistic</text>
<path d="M120,164 h83.5 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-83.5 z" fill="#2a78d6"/>
<text x="215.5" y="179.0" font-size="12" fill="#52514e">50건 · 초과 판매 0</text>
<text x="110" y="215.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">optimistic</text>
<path d="M120,200 h83.5 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-83.5 z" fill="#2a78d6"/>
<text x="215.5" y="215.0" font-size="12" fill="#52514e">50건 · 초과 판매 0</text>
<text x="110" y="251.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">redisson</text>
<path d="M120,236 h83.5 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-83.5 z" fill="#2a78d6"/>
<text x="215.5" y="251.0" font-size="12" fill="#52514e">50건 · 초과 판매 0</text>
<line x1="207.5" y1="82" x2="207.5" y2="266" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="211.5" y="78" font-size="11" fill="#0b0b0b">재고 50</text>
<line x1="120" y1="86" x2="120" y2="266" stroke="#898781" stroke-width="1"/>
</svg>
