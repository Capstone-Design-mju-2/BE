name: capstone-be

services:
  catalog-db:
    image: postgres:17.6-alpine
    # Debezium reads the outbox from the write-ahead log, which needs logical decoding (ADR-132).
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME:-catalog}
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog-local}
    ports:
      - "127.0.0.1:${CATALOG_DB_PORT:-5433}:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  order-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-orders}
      POSTGRES_USER: ${ORDER_DB_USER:-orders}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-orders-local}
    ports:
      - "127.0.0.1:${ORDER_DB_PORT:-5434}:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One KRaft broker carrying the outbox events Debezium reads from catalog-db (ADR-132), only for the sync
  # experiment: start it with `docker compose up -d kafka connect`. The indexer on the Mac uses the host listener,
  # Kafka Connect the internal one. Memory limits follow ADR-118. Topics live in the container, not a volume.
  kafka:
    image: apache/kafka:4.3.2
    profiles: ["cdc"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:${KAFKA_PORT:-9092},DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    mem_limit: 1g
    restart: unless-stopped

  # Kafka Connect with the Debezium connectors. scripts/register_outbox_connector.py adds the one for catalog's
  # outbox; its database password comes from this environment, not from the connector config.
  connect:
    image: quay.io/debezium/connect:3.6.2.Final
    profiles: ["cdc"]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: catalog-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      HEAP_OPTS: -Xms256m -Xmx512m
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog-local}
    ports:
      - "127.0.0.1:${CONNECT_PORT:-8083}:8083"
    depends_on:
      - kafka
      - catalog-db
    mem_limit: 1g
    restart: unless-stopped

  # Review vectors for semantic search (ADR-98, ADR-101). 800k reviews at 16-bit need about 1.64 GiB of native memory
  # outside the 1 GiB heap, and the node used 3.87 GiB once they were loaded: at 4 GiB the kernel killed it under 10
  # concurrent searches. The k-NN breaker's default 50% of what the heap leaves measured as too small for them.
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      knn.memory.circuit_breaker.limit: 75%
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    mem_limit: 5g
    # Java runs as PID 1 here and never reaps the health check's curl, so each check left a zombie: about 50,000 after
    # three days, when no container could start a process any more. The init process reaps them.
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s'"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  catalog-db-data:
  order-db-data:
  opensearch-data:
