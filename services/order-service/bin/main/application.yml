spring:
  application:
    name: order-service
  datasource:
    url: "jdbc:postgresql://127.0.0.1:${ORDER_DB_PORT:5434}/${ORDER_DB_NAME:orders}"
    username: ${ORDER_DB_USER:orders}
    password: ${ORDER_DB_PASSWORD:orders-local}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  address: ${ORDER_SERVICE_HOST:127.0.0.1}
  port: ${ORDER_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
