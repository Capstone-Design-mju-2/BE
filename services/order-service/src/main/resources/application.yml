spring:
  application:
    name: order-service
  datasource:
    url: "jdbc:postgresql://127.0.0.1:${ORDER_DB_PORT:5434}/${ORDER_DB_NAME:orders}"
    username: ${ORDER_DB_USER:orders}
    password: ${ORDER_DB_PASSWORD:orders-local}
  flyway:
    enabled: true
    # Flyway's default (*:future) lets a build older than the schema start and fail later on writes.
    ignore-migration-patterns: "repeatable:future"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  address: ${ORDER_SERVICE_HOST:127.0.0.1}
  port: ${ORDER_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

order:
  redisson:
    # order.stock-strategy가 redisson일 때만 Redis에 연결한다.
    address: "redis://127.0.0.1:${REDIS_PORT:6379}"
    timeout-millis: 1000
    wait-millis: 3000