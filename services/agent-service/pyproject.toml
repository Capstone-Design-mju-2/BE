[project]
name = "agent-service"
version = "0.1.0"
description = "FastAPI agent service and MCP client"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "mcp==2.2.0",
    "pydantic-settings==2.15.0",
    "uvicorn==0.53.0",
]

[project.scripts]
agent-service = "agent_service.__main__:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]
