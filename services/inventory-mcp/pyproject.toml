[project]
name = "inventory-mcp"
version = "0.1.0"
description = "MCP server for inventory tools"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx==0.28.1",
    "mcp==2.2.0",
]

[project.scripts]
inventory-mcp = "inventory_mcp.server:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_mcp"]
