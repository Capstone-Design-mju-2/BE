[project]
name = "indexer"
version = "0.1.0"
description = "Applies catalog changes to the OpenSearch review index"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx==0.28.1",
    "psycopg[binary]==3.2.9",
]

[project.scripts]
indexer = "indexer.main:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indexer"]
