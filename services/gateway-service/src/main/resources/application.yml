spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
          # Every public path under /api; /internal/* (load and price APIs) and the services' actuator are not
          # routed, so they answer 404 (ADR-133).
          routes:
            - id: chat
              uri: ${AGENT_SERVICE_URL:http://127.0.0.1:8000}
              predicates:
                - Path=/api/v1/chat
              filters:
                - name: CircuitBreaker
                  args:
                    name: agent
                    fallbackUri: forward:/fallback
            - id: catalog
              uri: ${CATALOG_SERVICE_URL:http://127.0.0.1:8081}
              predicates:
                - Path=/api/v1/products/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalog
                    fallbackUri: forward:/fallback
            - id: order
              uri: ${ORDER_SERVICE_URL:http://127.0.0.1:8082}
              predicates:
                - Path=/api/v1/inventories/**,/api/v1/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: order
                    fallbackUri: forward:/fallback

server:
  address: ${GATEWAY_SERVICE_HOST:127.0.0.1}
  port: ${GATEWAY_SERVICE_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

resilience4j:
  timelimiter:
    instances:
      # Longer than the chat's own 60 s limit for all its LLM calls, after which the agent answers by rules.
      agent:
        timeout-duration: 75s
      catalog:
        timeout-duration: 10s
      order:
        timeout-duration: 10s
  circuitbreaker:
    configs:
      default:
        # Open after half of the last 10 calls (at least 5) failed or timed out, then try 2 calls after 10 s.
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
