spring:
  application:
    name: catalog-service
  datasource:
    url: "jdbc:postgresql://127.0.0.1:${CATALOG_DB_PORT:5433}/${CATALOG_DB_NAME:catalog}"
    username: ${CATALOG_DB_USER:catalog}
    password: ${CATALOG_DB_PASSWORD:catalog-local}
  flyway:
    enabled: true
    # Flyway's default (*:future) lets a build older than the schema start and fail later on writes.
    ignore-migration-patterns: "repeatable:future"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  address: ${CATALOG_SERVICE_HOST:127.0.0.1}
  port: ${CATALOG_SERVICE_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

catalog:
  # How a price change reaches the review index (ADR-121): none, dual-write or outbox.
  index-sync: ${CATALOG_INDEX_SYNC:none}
  opensearch:
    url: ${OPENSEARCH_URL:http://127.0.0.1:9200}
    index: ${OPENSEARCH_INDEX:reviews}
    # A paused OpenSearch holds the price API this long before the dual write gives up.
    timeout-millis: 2000
