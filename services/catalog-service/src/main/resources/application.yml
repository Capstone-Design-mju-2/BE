spring:
  application:
    name: catalog-service
  datasource:
    url: "jdbc:postgresql://127.0.0.1:${CATALOG_DB_PORT:5433}/${CATALOG_DB_NAME:catalog}"
    username: ${CATALOG_DB_USER:catalog}
    password: ${CATALOG_DB_PASSWORD:catalog-local}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  address: ${CATALOG_SERVICE_HOST:127.0.0.1}
  port: ${CATALOG_SERVICE_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
